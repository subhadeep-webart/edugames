function getSelRnds(){console.log("getSelRnds()")

    const selectedValues = [];
    let count = 0;
    for (const option of rndSelLst.options){
       if (option.selected) {
          const sel = option.text;
          if(sel.length > 2){
            const selR = sel.replaceAll(",",";") 
            selectedValues.push(selR);
            if(++count > 6)break;
            console.log("--" + selR + "--")
          }  
       }    
    }
    let setBuf = "TestSet/,Set;5;9.2;500;TestSet/;2024Nov2,AvgGrade=9.2+Points=500+TotalRounds=5+SubSets=0+SubSetRnds=0+WebPages=0+Instructions=0+Commands=0+Comments=0+,ThGaTe;;;;,gPRA1_75+,,Fu2,"

    }
    console.log("setBuf " + setBuf );
    
}

function createTree(textArr){console.log( "createTree " + textArr.length)

    }

     let buf2 = "";
     abrevArr[indentA]= abb;

     for (let j = 0; j < indentA; j++) {
         buf2+= "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;";
     }
     let bufAbrev = ""
     for (let j = 0; j < indentA+1; j++) {
         bufAbrev+= "/" + abrevArr[j];

       console.log("bufAbrev= " + bufAbrev)
     buf2+= "<input type='checkbox' class='lineItem' name='" + bufAbrev + "'>" + xx + "</div><br>\n"     
     buf+= buf2;   
 }
  return "</span>" + buf;
