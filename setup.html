    function insertIntoInfoBox(txt){
        const infoBox = document.getElementById("infoBox");

        infoBox.style.height = "500px";

    function showSetInfo() {
        const setSerNbr = document.getElementById("setSerNbr").value;
        console.log("showSetInfo() " + setSerNbr)

        const url = '/cgi-bin/GetASetTSD.pl?' + setSerNbr;
        console.log("url = " + url);
        fetch(url)
            .then(response => response.text())
            .then(data => {
                if (data != null) {
                    console.log("CP.fetch data=  " + data.substring(0, 36));
                    data = deComma(data);
                    //console.log("set data= " + data);
                    const arr = data.split(",");
                    for (let i = 0; i < arr.length; i++) {
                        console.log(i + "= " + arr[i] + "\n<br>");
                    }

                    //console.log("arr = " + arr);
                    let buf = ""
                    buf += "Basic Data:  " + arr[4] + "\n**************The Challenge************** \n";
                    let rndNbr = 1;

                    for (let i = 9; i < arr.length; i++) {
                        const arr2 = arr[i].split(";");
                        const type = arr2[0];
                        if (type == "Set") {//14= Set;PRA1_1778;6;9.166667;600;-;;TSD6UgamesTest;:ZoneBreakDown=2.:NbrRndsToPlay=1;2
                            let buf3 = "";
                            for (let j = 0; j < arr2.length; j++) {
                                buf3 += j + "=" + arr2[j] + "\n<br>";
                            }
                            console.log("Set arr2 = " + buf3);

                            const totNbrOfRnds = arr2[2];
                            const rndBrkDwn = arr2[2];
                            buf+= (rndNbr++) + " = Set # " + arr2[1] +  " Titled " + arr2[7] + ", consists of " + totNbrOfRnds + " Rounds, of which ";
                            const n = arr2[8].indexOf("NbrRndsToPlay=")
                            console.log("n = " + n + "  -- " + arr2[8]);
                            const nbrRndsToPlay = arr2[8].substring(n + 14,n + 15);


                            buf += nbrRndsToPlay + " Round(s) are to be selected at random to be played. \n\n";

                            const rndBrkDwnArr = rndBrkDwn.split(":");
                            for (let k = 0; k < rndBrkDwnArr.length; k++) {
                                const rndBrkDwnArr2 = rndBrkDwnArr[k].split("=");
                                //buf += rndBrkDwnArr2[0] + " = " + rndBrkDwnArr2[1] + "\n";
                                console.log("rndBrkDwnArr2 = " + rndBrkDwnArr2[0] + " = " + rndBrkDwnArr2[1]);
                            }
                        } else if (type == "Rnd") {
                            buf += rndNbr++ + " =  " + arr2[1] + "-" + arr2[7] + "\n\n";
                        }
                    }
                    //alert(buf);
                    insertIntoInfoBox(buf);
                    console.log(buf);
                } else {
                    alert("Something went wrong and the Set could not be downloaded");
                    return;
                }
            });
    }

<!-- ==========================================================================
     NEW UI behaviour only. Nothing below changes game logic — it drives the
     presentation and delegates to the live functions defined above.
     ========================================================================== -->
<script>
(function () {
  "use strict";

  /* ---------- single-player toggle ---------- */
  var toggle = document.getElementById("singlePlayerToggle");
  var arena  = document.getElementById("playerArena");
  var second = document.getElementById("secondPlayer");

  if (toggle) {
    toggle.addEventListener("click", function () {
      var on = toggle.getAttribute("aria-pressed") === "true";
      var next = !on;

      toggle.setAttribute("aria-pressed", String(next));
      toggle.classList.toggle("is-on", next);
      arena.classList.toggle("is-single", next);

      if (next) {
        /* the live function hides #secondPlayer and sets the global */
        setSinglePlayerMode();
      } else {
        second.style.display = "";
        second.style.visibility = "";
        singlePlayerMode = false;
      }
    });
  }

  /* ---------- advanced panel ---------- */
  var gear  = document.getElementById("btnAdvanced");
  var panel = document.getElementById("advancedPanel");

  /* Advanced panel disabled for now (client request). The markup stays in
     the DOM because getData() reads z0/g0/z1/g1 and the startup code sets
     .size on z0/z1 -- removing the fields would throw. Re-enable by
     restoring the listener below and un-hiding #btnAdvanced above. */
  if (gear && panel) {
    panel.classList.remove("is-open");
    // gear.addEventListener("click", function () {
    //   var open = panel.classList.toggle("is-open");
    //   gear.setAttribute("aria-expanded", String(open));
    // });
  }

  /* ---------- profile images ----------
     Purely cosmetic: the picked image is shown in the ring. It is not sent
     anywhere, because the registration payload has no field for it. */
  document.querySelectorAll("[data-photo-for]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var slot  = btn.getAttribute("data-photo-for");
      var ring  = document.getElementById("avatar" + slot);
      var input = document.createElement("input");

      input.type   = "file";
      input.accept = "image/*";

      input.addEventListener("change", function () {
        var file = input.files && input.files[0];
        if (!file || !ring) { return; }

        var reader = new FileReader();
        reader.onload = function (e) {
          ring.innerHTML = "";
          var img = document.createElement("img");
          img.src = e.target.result;
          img.alt = "";
          ring.appendChild(img);
        };
        reader.readAsDataURL(file);
      });

      input.click();
    });
  });

  /* ---------- reveal the info box once Set Info has run ---------- */
  var infoWrap = document.getElementById("infoInsertPt");
  var infoBox  = document.getElementById("infoBox");

  if (infoWrap && infoBox) {
    var reveal = function () {
      if (infoBox.value && infoBox.value.trim() !== "") {
        infoWrap.classList.add("is-open");
      }
    };
    /* showSetInfo() fills it asynchronously, so poll briefly after a click */
    document.addEventListener("click", function (e) {
      if (e.target && e.target.textContent === "Set Info") {
        var tries = 0;
        var t = setInterval(function () {
          reveal();
          if (++tries > 20 || infoWrap.classList.contains("is-open")) {
            clearInterval(t);
          }
        }, 250);
      }
    });
  }
}());
</script>

</body>
