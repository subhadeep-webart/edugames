<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trivia-SmackDown</title>

  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/splash.css">

  <!-- Preload the hero art so the splash never flashes empty -->
  <link rel="preload" as="image" href="images/new-images/trivia_smackdown_splash_image.svg">
  <link rel="preload" as="image" href="images/new-images/homepage_left_zap.svg">
  <link rel="preload" as="image" href="images/new-images/homepage_right_zap.svg">
</head>

<body class="tsd-splash">

  <div class="tsd-splash-stage">

    <!-- ambient background layers -->
    <div class="tsd-vignette" aria-hidden="true"></div>
    <div class="tsd-sparks" id="tsdSparks" aria-hidden="true"></div>

    <div class="tsd-container">

      <!-- ---------- hero: zap | logo | zap ---------- -->
      <div class="tsd-hero">

        <div class="tsd-zap tsd-zap--left" aria-hidden="true">
          <img src="images/new-images/homepage_left_zap.svg"
               width="312" height="381" alt="">
        </div>

        <div class="tsd-logo">
          <img src="images/new-images/trivia_smackdown_splash_image.svg"
               width="553" height="554" alt="Trivia SmackDown">
        </div>

        <div class="tsd-zap tsd-zap--right" aria-hidden="true">
          <img src="images/new-images/homepage_right_zap.svg"
               width="296" height="399" alt="">
        </div>

      </div>

      <!-- ---------- loader ---------- -->
      <div class="tsd-loader">
        <p class="tsd-loader-label">Loading&hellip;</p>

        <div class="tsd-progress"
             role="progressbar"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
             aria-labelledby="tsdPct"
             id="tsdProgress">
          <div class="tsd-progress-fill" id="tsdProgressFill"></div>
        </div>

        <p class="tsd-progress-pct" id="tsdPct">0%</p>
      </div>

    </div>
  </div>

<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------------
     Where to go when the splash finishes.
     Change this one line to point the splash at a different page.
     --------------------------------------------------------------- */
  var NEXT_PAGE  = "start.html";
  var MIN_TIME   = 2600;   // ms the splash is shown at minimum

  var fillEl  = document.getElementById("tsdProgressFill");
  var pctEl   = document.getElementById("tsdPct");
  var barEl   = document.getElementById("tsdProgress");

  /* ---------- drifting sparks (decorative) ---------- */
  (function buildSparks() {
    var host = document.getElementById("tsdSparks");
    if (!host) { return; }
    if (window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches) { return; }

    var COUNT = 26;
    var frag  = document.createDocumentFragment();

    for (var i = 0; i < COUNT; i++) {
      var s = document.createElement("span");
      s.className = "tsd-spark";
      s.style.left              = (Math.random() * 100).toFixed(2) + "%";
      s.style.animationDuration = (7 + Math.random() * 9).toFixed(2) + "s";
      s.style.animationDelay    = (-Math.random() * 12).toFixed(2) + "s";
      s.style.opacity           = "0";
      s.style.transform         = "scale(" + (0.5 + Math.random()).toFixed(2) + ")";
      frag.appendChild(s);
    }
    host.appendChild(frag);
  }());

  /* ---------- progress ---------- */
  var pct     = 0;
  var started = Date.now();

  function render(value) {
    var v = Math.max(0, Math.min(100, Math.round(value)));
    fillEl.style.width = v + "%";
    pctEl.textContent  = v + "%";
    barEl.setAttribute("aria-valuenow", v);
  }

  function tick() {
    // ease toward 100 so the bar decelerates near the end
    var remaining = 100 - pct;
    pct += Math.max(0.6, remaining * 0.06) * (0.6 + Math.random() * 0.8);

    if (pct >= 100) {
      pct = 100;
      render(pct);
      finish();
      return;
    }

    render(pct);
    setTimeout(tick, 70 + Math.random() * 90);
  }

  function finish() {
    var wait = Math.max(0, MIN_TIME - (Date.now() - started));
    setTimeout(function () {
      window.location.href = NEXT_PAGE;
    }, wait + 450);
  }

  render(0);
  setTimeout(tick, 260);
}());
</script>

</body>
</html>
